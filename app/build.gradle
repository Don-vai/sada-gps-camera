plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.regon.sadagpscamera'
    compileSdk 34

    defaultConfig {
        applicationId "com.regon.sadagpscamera"
        minSdk 24
        targetSdk 34

        versionCode 8
        versionName "8.0-SADA-GPS"

        buildConfigField "String", "APP_NAME", '"SADA GPS Camera"'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Android core
    implementation 'androidx.core:core-ktx:1.12.0'

    // Activity Result API — permissions
    implementation 'androidx.activity:activity-ktx:1.9.3'

    // CameraX preview, capture and front/back camera switching
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // Guava — CameraX ListenableFuture
    implementation 'com.google.guava:guava:33.3.1-android'

    // GPS location
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // Google AdMob SDK
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
